[package]
authors.workspace = true
description = "Library for compression operations in ALPM"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "alpm-compress"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.3"

[dependencies]
alpm-types.workspace = true
bzip2 = "0.6.0"
flate2.workspace = true
fluent-i18n.workspace = true
knus = { optional = true, workspace = true }
liblzma = { version = "0.4.1", features = ["parallel"] }
log.workspace = true
num_cpus = "1.17.0"
serde = { optional = true, workspace = true }
tar.workspace = true
thiserror.workspace = true
zstd = { version = "0.14.0", features = ["zstdmt"] }

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true
testresult.workspace = true

[features]
default = ["serde"]
# Enable knus deserialization for settings types.
knus = ["dep:knus"]
serde = ["dep:serde"]

[lints]
workspace = true
