[advisories]
ignore = [
    # The rsa crate is vulnerable to side-channel attacks.
    # However, we are neither using it for work with private keys, nor over the network.
    "RUSTSEC-2023-0071",
    # The crypto-bigint crate suffers from constant time issues.
    # However, beyond tests we are not operating on private key material at all.
    # The rpgp crate currently depends on the older set of rustcrypto releases, because that ecosystem is stuck in endless release mode (see also https://github.com/rpgp/rpgp/pull/573)
    "RUSTSEC-2026-0387",
]
version = 2
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]
version = 2

[[licenses.clarify]]
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
name = "ring"
version = "*"

[bans]
multiple-versions = "allow"
